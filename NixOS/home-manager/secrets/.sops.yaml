# SOPS configuration
# 
# To use age (recommended):
# 1. Generate key: nix-shell -p age --run "age-keygen -o ~/.config/sops/age/keys.txt"
# 2. Get public key from output
# 3. Add it to creation_rules below

creation_rules:
  - path_regex: secrets\.yaml$
    # For age (recommended):
    # age: >-
    #   age1xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    
    # For GPG:
    # gpg: >-
    #   YOUR_GPG_KEY_ID_HERE
    encrypted_regex: "^(github-token|api-key|password)$"
